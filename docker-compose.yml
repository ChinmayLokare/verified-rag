# Local development stack. Credentials here are for a throwaway local database only.
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: vrag
      POSTGRES_PASSWORD: vrag
      POSTGRES_DB: vrag
    ports:
      # 5433 on the host so it doesn't clash with a natively installed Postgres on 5432.
      - "${VRAG_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrag -d vrag"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
