[project]
name = "verified-rag"
version = "0.1.0"
description = "Agentic RAG where every number and claim is traced to its source, with refusal when it can't verify."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "langchain-core==1.8.4",
    "langchain-ollama==1.2.0",
    "langgraph==1.2.24",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
vrag = "verified_rag.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verified_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "packs", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests", "packs", "evals"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running Postgres (DATABASE_URL); skipped when unreachable",
]
